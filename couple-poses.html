<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couple Poses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Hanken+Grotesk:wght@400;500;650&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a contact sheet of couple poses. Big diagrams in a grid; click one to see it full size. */
:root{
  --bg:#EEF1EE; --paper:#FBFCFB; --ink:#18201E; --muted:#5B6662; --rule:#D3D9D5;
  --accent:#18766F; --accent-soft:#D3EAE6; --ok:#2E8A4E; --no:#C2443A;
  --figA:#34404C; --figB:#FFFFFF; --fam:#89A294; --famd:#B7C9BD; --kid:#E1B565;
  --outline:#27313B; --bloom:#D78897; --leaf:#5E8C5A; --prop:#C9BDAA; --ground:#BCC5BF;
  --veil:rgba(255,255,255,.6); --scrim:rgba(18,24,22,.72);
  --display:"Bodoni Moda", Didot, "Bodoni 72", "Times New Roman", serif;
  --body:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121816; --paper:#1A211F; --ink:#E6ECE9; --muted:#97A49E; --rule:#2C3532;
    --accent:#5BC4B8; --accent-soft:#1D3A36; --ok:#5CBF7C; --no:#EC7A6C;
    --figA:#7E93A7; --figB:#F3EEE8; --fam:#6E8C7C; --famd:#A3B9AC; --kid:#CFA35C;
    --outline:#0B0F0E; --bloom:#D88B9A; --leaf:#7EAA78; --prop:#6E655A; --ground:#3B4541;
    --veil:rgba(243,238,232,.28); --scrim:rgba(0,0,0,.75); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,3vw,40px)}

header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 40px;padding-block:40px 24px}
.eyebrow{font:500 .72rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
h1{font:italic 500 clamp(2.4rem,5vw,3.6rem)/1 var(--display);margin:0;text-wrap:balance}
.sub{margin:10px 0 0;color:var(--muted);max-width:52ch}
.key{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0;padding:0;list-style:none;font-size:.85rem;color:var(--muted)}
.key li{display:flex;align-items:center;gap:8px}
.key svg{width:22px;height:34px}

.sheet{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));padding-bottom:56px}
.pose{all:unset;box-sizing:border-box;cursor:zoom-in;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;transition:border-color .15s, transform .15s}
.pose:hover{border-color:var(--accent);transform:translateY(-2px)}
.pose:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.frame{position:relative;padding:14px 14px 4px}
.frame::before{content:"";position:absolute;inset:10px;pointer-events:none;opacity:.5;
  background:
    linear-gradient(var(--muted),var(--muted)) left top/16px 1.5px no-repeat,
    linear-gradient(var(--muted),var(--muted)) left top/1.5px 16px no-repeat,
    linear-gradient(var(--muted),var(--muted)) right top/16px 1.5px no-repeat,
    linear-gradient(var(--muted),var(--muted)) right top/1.5px 16px no-repeat,
    linear-gradient(var(--muted),var(--muted)) left bottom/16px 1.5px no-repeat,
    linear-gradient(var(--muted),var(--muted)) left bottom/1.5px 16px no-repeat,
    linear-gradient(var(--muted),var(--muted)) right bottom/16px 1.5px no-repeat,
    linear-gradient(var(--muted),var(--muted)) right bottom/1.5px 16px no-repeat}
.frame svg{display:block;width:100%;height:auto}
.cap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 18px 16px;border-top:1px solid var(--rule)}
.cap h2{font:500 1.35rem/1.15 var(--display);margin:0}
.cap span{font:500 .72rem/1.3 var(--mono);color:var(--muted);white-space:nowrap}

/* full-size view */
dialog{border:0;padding:0;background:transparent;max-width:min(1100px,100vw - 32px);width:100%;max-height:calc(100dvh - 32px);color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
.zoom{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);background:var(--paper);border-radius:10px;overflow:hidden;max-height:calc(100dvh - 32px)}
.zoom .frame{padding:22px;display:flex;align-items:center;border-right:1px solid var(--rule)}
.zoom .frame::before{inset:14px}
.info{padding:28px 26px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.info .num{font:500 .72rem var(--mono);color:var(--muted);letter-spacing:.08em}
.info h2{font:italic 500 2.1rem/1.05 var(--display);margin:0;text-wrap:balance}
.info p{margin:0;color:var(--muted)}
.info ol{margin:0;padding:0;list-style:none;counter-reset:c;display:grid;gap:10px}
.info li{counter-increment:c;display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:8px}
.info li::before{content:counter(c);font:500 .78rem/1.7 var(--mono);color:var(--accent)}
.info .spec{font:500 .78rem var(--mono);color:var(--muted);border-top:1px dashed var(--rule);padding-top:12px;margin-top:auto}
.nav{display:flex;gap:8px}
.nav button{font:500 .85rem var(--body);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:99px;padding:7px 14px;cursor:pointer}
.nav button:hover{border-color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .close{margin-left:auto}
@media (max-width:760px){
  .zoom{grid-template-columns:minmax(0,1fr);overflow:auto}
  .zoom .frame{border-right:0;border-bottom:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){.pose{transition:none}.pose:hover{transform:none}}

/* diagram vocabulary */
svg .o{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .c{stroke-linejoin:round;stroke-linecap:round}
.ol .o,.ol .c{stroke:var(--outline)} .ol .c{fill:var(--outline)}
.fa .o,.fa .c{stroke:var(--figA)} .fa .c{fill:var(--figA)}
.fb .o,.fb .c{stroke:var(--figB)} .fb .c{fill:var(--figB)}
.ff .o,.ff .c{stroke:var(--fam)}  .ff .c{fill:var(--fam)}
.fd .o,.fd .c{stroke:var(--famd)} .fd .c{fill:var(--famd)}
.fk .o,.fk .c{stroke:var(--kid)}  .fk .c{fill:var(--kid)}
.td .c{stroke:var(--outline);stroke-width:1.3px}
.bq .leaf{fill:var(--leaf);stroke:var(--outline);stroke-width:.8}
.bq .bloom{fill:var(--bloom);stroke:var(--outline);stroke-width:.8}
.cam rect{fill:var(--ink)} .cam .lens{fill:var(--muted)}
.an{fill:none;stroke-width:1.3;stroke-linecap:round}
.an.d{stroke-dasharray:3.5 3}
.an.ac{stroke:var(--accent)} .an.ok{stroke:var(--ok)} .an.no{stroke:var(--no)} .an.mu{stroke:var(--muted)}
.ah.ac{fill:var(--accent)} .ah.ok{fill:var(--ok)} .ah.no{fill:var(--no)} .ah.mu{fill:var(--muted)}
.lb{font-family:var(--mono);font-size:7.4px;font-weight:500}
.lb.ac{fill:var(--accent)} .lb.mu{fill:var(--muted)} .lb.ok{fill:var(--ok)} .lb.no{fill:var(--no)}
.dot{fill:var(--accent)}
.gnd{stroke:var(--ground);stroke-width:1.5}
.prop{fill:var(--prop);stroke:var(--outline);stroke-width:1}
.veil{fill:var(--veil);stroke:var(--outline);stroke-width:.7;stroke-dasharray:2 2}
.dim{fill:var(--paper);opacity:.72}
.crop{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-dasharray:5 3}
.shadow{fill:var(--ground)}
.eye{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:.5 3.2;stroke-linecap:round;fill:none}
</style>
</head>
<body>
<header class="wrap">
  <div>
    <p class="eyebrow">Wedding posing · couples</p>
    <h1>Couple Poses</h1>
    <p class="sub">Twelve essential poses for the couple portrait session. Click any pose for the full-size diagram and the cues to give.</p>
  </div>
  <ul class="key" id="key"></ul>
</header>

<main class="wrap">
  <div class="sheet" id="sheet"></div>
</main>

<dialog id="zoom" aria-labelledby="z-title">
  <div class="zoom">
    <div class="frame" id="z-fig"></div>
    <div class="info">
      <div class="nav">
        <button type="button" id="z-prev" aria-label="Previous pose">← Prev</button>
        <button type="button" id="z-next" aria-label="Next pose">Next →</button>
        <button type="button" class="close" id="z-close">Close</button>
      </div>
      <span class="num" id="z-num"></span>
      <h2 id="z-title"></h2>
      <p id="z-use"></p>
      <ol id="z-steps"></ol>
      <div class="spec" id="z-spec"></div>
    </div>
  </div>
</dialog>

<script>
(() => {
const G = 186;
const r1 = n => Math.round(n * 10) / 10;
const pt = p => r1(p[0]) + ',' + r1(p[1]);

// Skeletons in relative units (x from centre, y up from the ground is negative).
const BASE = {
  A: { h:[0,-140], r:11, sh:[[-15,-120],[15,-120]], el:[[-19,-96],[19,-96]], ha:[[-19,-72],[19,-72]],
       hp:[[-9,-76],[9,-76]], kn:[[-9,-38],[9,-38]], ft:[[-10,-3],[10,-3]] },
  B: { h:[0,-132], r:10, sh:[[-12,-113],[12,-113]], el:[[-15,-91],[15,-91]], ha:[[-14,-69],[14,-69]],
       wa:[[-8,-86],[8,-86]], hem:[[-30,-2],[30,-2]] }
};
const TYPES = {
  A:{b:'A',c:'fa'}, B:{b:'B',c:'fb'}, F:{b:'A',c:'ff'}, D:{b:'B',c:'fd'},
  K:{b:'A',c:'fk',s:.55,r:14}, Kd:{b:'B',c:'fk',s:.58,r:14}
};
const FACE = { r:[0,1], l:[180,1], qr:[0,.5], ql:[180,.5] };
// Profile and seated presets
const PA = { sh:[[-6,-120],[6,-120]], hp:[[-5,-76],[5,-76]], kn:[[-6,-38],[4,-38]], ft:[[-7,-3],[7,-3]], el:[[-1,-96],[2,-96]], ha:[[1,-72],[3,-72]] };
const PB = { sh:[[-5,-113],[5,-113]], wa:[[-6,-86],[6,-86]], hem:[[-24,-2],[26,-2]], el:[[-1,-91],[1,-91]], ha:[[0,-69],[2,-69]] };
const SEAT_A = { h:[0,-110], sh:[[-15,-90],[15,-90]], hp:[[-10,-46],[10,-46]], kn:[[-13,-42],[13,-42]], ft:[[-13,-3],[13,-3]], el:[[-19,-66],[19,-66]], ha:[[-9,-50],[9,-50]], front:[0,1] };
const SEAT_B = { h:[0,-104], sh:[[-12,-86],[12,-86]], wa:[[-8,-60],[8,-60]], hem:[[-24,-2],[24,-2]], el:[[-15,-66],[15,-66]], ha:[[-4,-52],[4,-52]], front:[0,1] };

function render(list, cls, pad) {
  const one = (s, o) => {
    const a = o ? pad : 0;
    if (s.k === 'l') return `<polyline class="o" points="${s.p.map(pt).join(' ')}" stroke-width="${r1(s.w + a)}"/>`;
    if (s.k === 'p') return `<polygon class="c" points="${s.p.map(pt).join(' ')}" stroke-width="${r1(s.w + a)}"/>`;
    if (s.k === 'd') return `<path class="c" d="${s.d}" stroke-width="${r1(s.w + a)}"/>`;
    return `<circle class="c" cx="${r1(s.c[0])}" cy="${r1(s.c[1])}" r="${r1(s.r + a / 2)}" stroke-width="0"/>`;
  };
  return `<g class="ol">${list.map(s => one(s, 1)).join('')}</g><g class="${cls}">${list.map(s => one(s, 0)).join('')}</g>`;
}

function bouquet(x, y, k = 1) {
  const leaves = [[-7,5,-35],[7,6,35],[0,9,0]];
  const blooms = [[-4,-1],[4,-2],[0,-5],[-1,3],[5,3],[-5,-5]];
  return `<g class="bq" transform="translate(${r1(x)},${r1(y)}) scale(${r1(k)})">` +
    leaves.map(([dx,dy,a]) => `<ellipse class="leaf" cx="${dx}" cy="${dy}" rx="2.4" ry="5" transform="rotate(${a} ${dx} ${dy})"/>`).join('') +
    blooms.map(([dx,dy]) => `<circle class="bloom" cx="${dx}" cy="${dy}" r="3.4"/>`).join('') + `</g>`;
}

function fig(o) {
  const T = TYPES[o.t], b = BASE[T.b];
  const s = (o.s ?? 1) * (T.s ?? 1), X = o.x, Y = o.y ?? G, k = Math.max(s, .6), pad = 3 * k;
  const get = n => { const v = o[n], d = b[n]; if (v == null) return d; return [v[0] ?? d[0], v[1] ?? d[1]]; };
  const P = p => [X + p[0] * s, Y + p[1] * s];
  const hide = o.hide || [], fr = o.front || [];
  const sh = get('sh').map(P), el = get('el').map(P), ha = get('ha').map(P);
  const h = P(o.h || b.h), r = (o.r ?? T.r ?? b.r) * s;
  const L = [], F = [];
  const aw = (T.b === 'A' ? 7.5 : 6.5) * k;
  [0,1].forEach(i => { if (!hide.includes('a' + i)) (fr.includes(i) ? F : L).push({k:'l', p:[sh[i], el[i], ha[i]], w:aw}); });
  if (T.b === 'A') {
    const hp = get('hp').map(P), kn = get('kn').map(P), ft = get('ft').map(P), fd = o.fd || [-1,1];
    [0,1].forEach(i => { if (!hide.includes('l' + i)) L.push({k:'l', p:[hp[i], kn[i], ft[i], [ft[i][0] + fd[i] * 4.5 * k, ft[i][1] + .5]], w:9.5 * k}); });
    L.push({k:'p', p:[sh[0], sh[1], hp[1], hp[0]], w:6 * k});
  } else {
    const [wl, wr] = get('wa').map(P), [hl, hr] = get('hem').map(P);
    const my = (a, c) => (a[1] + c[1]) / 2;
    L.push({k:'d', w:3 * k, d:`M${pt(wl)} C${pt([wl[0] - 2*k, my(wl,hl)])} ${pt([hl[0] + 5*k, my(wl,hl)])} ${pt(hl)} L${pt(hr)} C${pt([hr[0] - 5*k, my(wr,hr)])} ${pt([wr[0] + 2*k, my(wr,hr)])} ${pt(wr)}Z`});
    L.push({k:'p', p:[sh[0], sh[1], wr, wl], w:5 * k});
  }
  L.push({k:'l', p:[[(sh[0][0] + sh[1][0]) / 2, (sh[0][1] + sh[1][1]) / 2], h], w:6.5 * k});
  L.push({k:'c', c:h, r});
  const R = Math.PI / 180, at = (d, m) => [h[0] + Math.cos(d * R) * m, h[1] + Math.sin(d * R) * m];
  if (FACE[o.face]) {
    const [base, q] = FACE[o.face];
    const t = (o.tilt || 0) + (q < 1 ? 30 : 14);
    const a = base === 0 ? t : 180 - t;
    L.push({k:'p', p:[at(a - 30, r * .8), at(a, r + (q < 1 ? 2.2 : 3.6) * k), at(a + 30, r * .8)], w:1.5 * k});
  }
  if (o.t === 'B' && o.face && o.face !== 'f') {
    const ang = o.face === 'b' ? 270 : (FACE[o.face][0] === 0 ? 220 : 320);
    L.push({k:'c', c:at(ang, r * .85), r:r * .42});
  }
  let bq = '';
  if (o.bq != null) {
    const p = o.bq === 'mid' ? [(ha[0][0] + ha[1][0]) / 2, (ha[0][1] + ha[1][1]) / 2] : ha[o.bq];
    bq = bouquet(p[0], p[1] + 2 * k, k);
  }
  return `<g>${render(L, T.c, pad)}${F.length ? render(F, T.c, pad) : ''}${bq}</g>`;
}
function limb(t, pts, o = {}) {
  const T = TYPES[t], s = (o.s ?? 1) * (T.s ?? 1), k = Math.max(s, .6);
  return render([{k:'l', p:pts, w:(o.w ?? (T.b === 'A' ? 7.5 : 6.5)) * k}], T.c, 3 * k);
}
function top(x, y, ang, t = 'A', sc = 1) {
  const T = TYPES[t], k = sc * (T.s ? .7 : 1);
  return `<g class="td ${T.c}" transform="translate(${r1(x)},${r1(y)}) rotate(${ang}) scale(${r1(k)})">` +
    (T.b === 'B' ? '<circle class="c" r="14"/>' : '') +
    `<ellipse class="c" rx="13" ry="6.5"/><circle class="c" cy="1.5" r="6.2"/><path class="c" d="M-2.6,6.8 L0,10.6 L2.6,6.8Z"/></g>`;
}
const cam = (x, y, ang = 0, sc = 1) => `<g class="cam" transform="translate(${x},${y}) rotate(${ang}) scale(${sc})"><rect x="-11" y="-3" width="22" height="13" rx="2.5"/><rect class="lens" x="-5.5" y="-10" width="11" height="8" rx="1.5"/><rect x="5" y="-5.5" width="4" height="3" rx="1"/></g>`;
const ln = (x1, y1, x2, y2, c = 'ac', d = 1) => `<line class="an ${c}${d ? ' d' : ''}" x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}"/>`;
function arw(x1, y1, x2, y2, c = 'ac', cx, cy) {
  const d = cx == null ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
  const fx = cx ?? x1, fy = cy ?? y1, a = Math.atan2(y2 - fy, x2 - fx), L = 6, W = 3.2;
  const p1 = [x2 - L * Math.cos(a) + W * Math.sin(a), y2 - L * Math.sin(a) - W * Math.cos(a)];
  const p2 = [x2 - L * Math.cos(a) - W * Math.sin(a), y2 - L * Math.sin(a) + W * Math.cos(a)];
  return `<path class="an ${c}" d="${d}"/><path class="ah ${c}" d="M${pt([x2, y2])} L${pt(p1)} L${pt(p2)}Z"/>`;
}
const tx = (x, y, s, c = 'mu', a = 'start') => `<text class="lb ${c}" x="${x}" y="${y}" text-anchor="${a}">${s.split('\n').map((l, i) => `<tspan x="${x}" dy="${i ? 9 : 0}">${l}</tspan>`).join('')}</text>`;
const co = (px, py, x, y, s, a = 'start') => { const ex = a === 'end' ? x + 3 : x - 3; return `<line class="an ac" x1="${px}" y1="${py}" x2="${ex}" y2="${y - 3}"/><circle class="dot" cx="${px}" cy="${py}" r="2"/>` + tx(x, y, s, 'ac', a); };
const ey = (x1, y1, x2, y2) => `<line class="eye" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><circle class="dot" cx="${x2}" cy="${y2}" r="1.8"/>`;
const bd = (x, y, ok, r = 8) => { const q = r / 8; return `<g class="bd ${ok ? 'ok' : 'no'}"><circle cx="${x}" cy="${y}" r="${r}"/><path stroke-width="${r1(1.8 * q)}" d="${ok ? `M${r1(x - 3.8*q)},${r1(y + .2*q)} L${r1(x - 1.2*q)},${r1(y + 3*q)} L${r1(x + 4*q)},${r1(y - 3*q)}` : `M${r1(x - 3*q)},${r1(y - 3*q)} L${r1(x + 3*q)},${r1(y + 3*q)} M${r1(x + 3*q)},${r1(y - 3*q)} L${r1(x - 3*q)},${r1(y + 3*q)}`}"/></g>`; };
const gr = (x1 = 0, x2 = 280, y = G) => `<line class="gnd" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`;
const split = () => `<line class="split" x1="160" y1="8" x2="160" y2="192"/>`;
const chair = (x, sy, s = 1) => `<rect class="prop" x="${r1(x - 17*s)}" y="${r1(sy - 40*s)}" width="${r1(34*s)}" height="${r1(40*s)}" rx="${r1(3*s)}"/><rect class="prop" x="${r1(x - 16*s)}" y="${r1(sy + 5*s)}" width="${r1(3*s)}" height="${r1(G - sy - 5*s)}"/><rect class="prop" x="${r1(x + 13*s)}" y="${r1(sy + 5*s)}" width="${r1(3*s)}" height="${r1(G - sy - 5*s)}"/><rect class="prop" x="${r1(x - 18*s)}" y="${r1(sy)}" width="${r1(36*s)}" height="${r1(5*s)}" rx="1.5"/>`;
const bench = (x1, x2, y) => `<rect class="prop" x="${x1 + 6}" y="${y + 5}" width="5" height="${G - y - 5}"/><rect class="prop" x="${x2 - 11}" y="${y + 5}" width="5" height="${G - y - 5}"/><rect class="prop" x="${x1}" y="${y}" width="${x2 - x1}" height="6" rx="2"/>`;
const T20 = s => `<g transform="translate(20,0)">${s}</g>`;
const pair = (a, b, okA = 0, okB = 1) => split() + bd(14, 14, okA) + bd(174, 14, okB) + a + b;


/* ---------- Couples ---------- */
const COUPLE = [
 { name:'Classic embrace', use:'The safe opener. Every gallery needs one, and it relaxes nervous couples.',
   steps:['B tucks into A\'s side; both turn 45° inward','A\'s hand on B\'s far waist, B\'s hand on A\'s chest','Lean heads in until temples almost touch'],
   spec:'85 mm · f/2.8 · ¾ length',
   svg: T20(gr(-20,260) +

const svgOf = c => `<svg viewBox="0 0 280 200" role="img" aria-label="Diagram: ${c.name}">${c.svg}</svg>`;
const n2 = i => String(i + 1).padStart(2, '0');

document.getElementById('sheet').innerHTML = COUPLE.map((c, i) =>
  `<button type="button" class="pose" data-i="${i}" aria-label="Open ${c.name}">` +
  `<div class="frame">${svgOf(c)}</div>` +
  `<div class="cap"><h2>${c.name}</h2><span>${c.spec.split('·')[0].trim()}</span></div></button>`).join('');

document.getElementById('key').innerHTML = [
  [fig({t:'A',x:11,y:33,s:.21}), 'Partner A'],
  [fig({t:'B',x:11,y:33,s:.22}), 'Partner B'],
  ['<line class="an ac" x1="2" y1="17" x2="20" y2="17"/><circle class="dot" cx="2" cy="17" r="2"/>', 'Cue'],
  [ey(2,17,20,17), 'Eyeline']
].map(([s, l]) => `<li><svg viewBox="0 0 22 34" aria-hidden="true">${s}</svg>${l}</li>`).join('');

const dlg = document.getElementById('zoom');
let cur = 0;
function show(i) {
  cur = (i + COUPLE.length) % COUPLE.length;
  const c = COUPLE[cur];
  document.getElementById('z-fig').innerHTML = svgOf(c);
  document.getElementById('z-num').textContent = `${n2(cur)} / ${COUPLE.length}`;
  document.getElementById('z-title').textContent = c.name;
  document.getElementById('z-use').textContent = c.use;
  document.getElementById('z-steps').innerHTML = c.steps.map(s => `<li><span>${s}</span></li>`).join('');
  document.getElementById('z-spec').textContent = c.spec;
}
document.getElementById('sheet').addEventListener('click', e => {
  const b = e.target.closest('.pose'); if (!b) return;
  show(+b.dataset.i); dlg.showModal();
});
document.getElementById('z-prev').onclick = () => show(cur - 1);
document.getElementById('z-next').onclick = () => show(cur + 1);
document.getElementById('z-close').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowRight') show(cur + 1);
});
dlg.addEventListener('close', () => document.querySelector(`.pose[data-i="${cur}"]`)?.focus());
})();
</script>
